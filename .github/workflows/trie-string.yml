name: trie-string

on:
  pull_request:
    paths:
      - 'src/cplib/str/trie_string.nim'
      - 'src/verify/str/trie_string_benchmark.nim'
      - 'tools/trie_string/**'
      - '.github/workflows/trie-string.yml'
  push:
    branches: [main]
    paths:
      - 'src/cplib/str/trie_string.nim'
      - 'src/verify/str/trie_string_benchmark.nim'
      - 'tools/trie_string/**'
      - '.github/workflows/trie-string.yml'

permissions:
  contents: read

jobs:
  test:
    name: trie-string (Nim ${{ matrix.nim-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        nim-version: ['1.6.20', '2.2.4', '2.2.6']
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v1
        with:
          nim-version: ${{ matrix.nim-version }}
      - name: Run C and C++ tests in debug and release
        run: python3 tools/trie_string/validate.py "$(command -v nim)"
